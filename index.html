      /* =====================================================================
         LÓGICA DE TIEMPO DE LECTURA (200 palabras por minuto, límite 08:00)
         ===================================================================== */

      const { useState, useEffect, useMemo, useRef, useCallback } = React;

      const PALABRAS_POR_MINUTO = 200;
      const LIMITE_LECTURA_SEGUNDOS = 8 * 60; // 480 s (08:00)
      const UMBRAL_AMBAR_SEGUNDOS = 7 * 60; // 420 s (07:00)
      const THEME_STORAGE_KEY = "montes-maria-tema";

      function contarPalabrasTexto(texto) {
        if (!texto) return 0;
        const trimmed = String(texto).trim();
        if (!trimmed) return 0;
        return trimmed.split(/\s+/).filter(Boolean).length;
      }

      function diaTieneTexto(dia) {
        const tieneParrafos =
          Array.isArray(dia.parrafos) &&
          dia.parrafos.some((p) => p && p.trim().length > 0);
        const tieneAnalisis = Boolean(
          (dia.contexto && dia.contexto.trim()) ||
            (dia.perspectiva && dia.perspectiva.trim()) ||
            (dia.aporteALaTesis && dia.aporteALaTesis.trim()) ||
            (dia.dilemaEtico && dia.dilemaEtico.trim()) ||
            (dia.cita && dia.cita.trim()) ||
            (dia.nuestraPostura && dia.nuestraPostura.trim())
        );
        return tieneParrafos || tieneAnalisis;
      }

      function contarPalabrasDia(dia) {
        if (!diaTieneTexto(dia)) return 0;
        let total = 0;
        if (Array.isArray(dia.parrafos)) {
          for (const p of dia.parrafos) {
            total += contarPalabrasTexto(p);
          }
        }
        total += contarPalabrasTexto(dia.contexto);
        total += contarPalabrasTexto(dia.perspectiva);
        total += contarPalabrasTexto(dia.aporteALaTesis);
        total += contarPalabrasTexto(dia.dilemaEtico);
        total += contarPalabrasTexto(dia.cita);
        total += contarPalabrasTexto(dia.nuestraPostura);
        return total;
      }

      function calcularSegundosLecturaDia(dia) {
        const palabras = contarPalabrasDia(dia);
        if (palabras === 0) return 0;
        return Math.max(1, Math.round((palabras / PALABRAS_POR_MINUTO) * 60));
      }

      function calcularSegundosTotales(dias) {
        return dias.reduce(
          (acc, dia) => acc + calcularSegundosLecturaDia(dia),
          0
        );
      }

      function formatearRelojMMSS(segundos) {
        const safe = Math.max(0, Math.floor(segundos));
        const mins = Math.floor(safe / 60);
        const secs = safe % 60;
        return (
          String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0")
        );
      }

      function formatearMinYS(segundos) {
        const safe = Math.max(0, Math.round(segundos));
        const mins = Math.floor(safe / 60);
        const secs = safe % 60;
        return mins + " min " + secs + " s";
      }

      function obtenerEstadoPresupuesto(totalSegundos) {
        if (totalSegundos > LIMITE_LECTURA_SEGUNDOS) {
          return { nivel: "rojo", etiqueta: "Supera el límite de 8 min" };
        }
        if (totalSegundos >= UMBRAL_AMBAR_SEGUNDOS) {
          return { nivel: "ambar", etiqueta: "Entre 7 y 8 min" };
        }
        return { nivel: "verde", etiqueta: "Menor a 7 min" };
      }

      function renderTextoMultiparrafo(texto) {
        const bloques = String(texto)
          .split(/\n\s*\n/)
          .map((b) => b.trim())
          .filter(Boolean);

        return bloques.map((bloque, idx) => (
          <p
            key={idx}
            className="prose-editorial text-[var(--text-primary)] [&:not(:first-child)]:mt-4"
          >
            {bloque}
          </p>
        ));
      }

      function DayReader({
        dia,
        totalDias,
        tesis,
        isVisited,
        onMarkVisited,
        onPrev,
        onNext,
      }) {
        const sentinelRef = useRef(null);
        const [imageError, setImageError] = useState(false);

        const hasText = diaTieneTexto(dia);
        const readingSeconds = calcularSegundosLecturaDia(dia);
        const showTesis = dia.numero === 1 || dia.numero === 7;
        const isSourceDay = dia.numero >= 2 && dia.numero <= 6;
        const tituloMostrado =
          (dia.titulo && dia.titulo.trim()) || "Día " + dia.numero;

        useEffect(() => {
          setImageError(false);
        }, [dia.numero, dia.imagen && dia.imagen.src]);

        useEffect(() => {
          const el = sentinelRef.current;
          if (!el || isVisited) return;

          if (typeof IntersectionObserver === "undefined") {
            onMarkVisited(dia.numero);
            return;
          }

          const observer = new IntersectionObserver(
            (entries) => {
              for (const entry of entries) {
                if (entry.isIntersecting) {
                  onMarkVisited(dia.numero);
                  observer.disconnect();
                  break;
                }
              }
            },
            { threshold: 0.5 }
          );

          observer.observe(el);
          return () => observer.disconnect();
        }, [dia.numero, isVisited, onMarkVisited]);

        const metaFuente = dia.fuente
          ? [dia.fuente.autor, dia.fuente.tipo, dia.fuente.anio]
              .map((s) => (s ? String(s).trim() : ""))
              .filter(Boolean)
          : [];

        return (
          <article
            aria-labelledby={"dia-titulo-" + dia.numero}
            className="min-w-0 flex-1 max-w-[68ch]"

                  <>
                    <span aria-hidden="true">·</span>
                    <span>Por {dia.integrante}</span>

                {isVisited && (

                      <IconCheck className="h-3.5 w-3.5" />

              <h2

              >
                {tituloMostrado}

              {dia.subtitulo && dia.subtitulo.trim() && (
                <p className="mt-2 text-base text-[var(--text-secondary)]">

                </p>
              )}

              {hasText && (
                <p className="mt-3 text-xs font-medium text-[var(--text-muted)]">

                  <span className="font-mono-clock text-[var(--text-secondary)]">

                  </span>

            {showTesis && (

                className="mt-7 rounded-sm border border-[var(--border-strong)] bg-[var(--bg-surface)] p-5 sm:p-6"

                {dia.contexto && dia.contexto.trim() && (

                {dia.cita && dia.cita.trim() && (

            <div

              className="mt-8 flex items-center justify-between border-t border-[var(--border-hairline)] pt-4 text-xs text-[var(--text-muted)]"
            >
              <span>
                {isVisited
                  ? "Día " + dia.numero + " marcado como visto"
                  : "Fin del Día " + dia.numero}
              </span>
              {isVisited && (
                <span className="inline-flex items-center gap-1 font-medium text-[var(--accent-olive)]">

            <nav
              aria-label="Navegación entre días"

            >
              <div className="flex items-center gap-3">
                <button
                  type="button"
                  onClick={onPrev}
                  disabled={dia.numero <= 1}
                  className="inline-flex min-h-[44px] items-center gap-2 rounded border border-[var(--border-hairline)] bg-[var(--bg-elevated)] px-4 py-2 text-sm font-medium text-[var(--text-primary)] transition-colors hover:border-[var(--border-strong)] hover:bg-[var(--bg-surface)] disabled:cursor-not-allowed disabled:opacity-40 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--accent-olive)] cursor-pointer whitespace-nowrap"
                >
                  <IconArrowLeft className="h-4 w-4" />
                  <span>Anterior</span>
                </button>

                <button
                  type="button"
                  onClick={onNext}
                  disabled={dia.numero >= totalDias}
                  className="inline-flex min-h-[44px] items-center gap-2 rounded bg-[var(--accent-olive)] px-4 py-2 text-sm font-medium text-[#FBF9F4] transition-colors hover:bg-[var(--accent-olive-hover)] disabled:cursor-not-allowed disabled:opacity-40 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--accent-olive)] cursor-pointer whitespace-nowrap"

      /* =====================================================================
         APLICACIÓN PRINCIPAL
         ===================================================================== */

      function App() {
        const [activeDay, setActiveDay] = useState(1);
        const [visitedDays, setVisitedDays] = useState(() => new Set());
        const [elapsedSeconds, setElapsedSeconds] = useState(0);
        const [isRunning, setIsRunning] = useState(false);
        const [hasStarted, setHasStarted] = useState(false);
        const [noticeDismissed, setNoticeDismissed] = useState(false);
        const [isDark, setIsDark] = useState(() => {
          try {
            return localStorage.getItem(THEME_STORAGE_KEY) === "dark";
          } catch {
            return false;
          }
        });

        const readerSectionRef = useRef(null);
        const wasRunningBeforeHideRef = useRef(false);

        const totalEstimatedSeconds = useMemo(
          () => calcularSegundosTotales(CONTENIDO_BLOG.dias),
          []
        );

        useEffect(() => {
          const root = document.documentElement;
          if (isDark) {
            root.classList.add("dark");
          } else {
            root.classList.remove("dark");
          }
          try {
            localStorage.setItem(THEME_STORAGE_KEY, isDark ? "dark" : "light");
          } catch {
            // Ignorar en entornos sin localStorage
          }
        }, [isDark]);

        useEffect(() => {
          if (!isRunning) return;
          const interval = window.setInterval(() => {
            setElapsedSeconds((prev) => prev + 1);
          }, 1000);
          return () => window.clearInterval(interval);
        }, [isRunning]);

        useEffect(() => {
          const handleVisibilityChange = () => {
            if (document.visibilityState === "hidden") {
              setIsRunning((currentlyRunning) => {
                wasRunningBeforeHideRef.current = currentlyRunning;
                return false;
              });
            } else if (document.visibilityState === "visible") {
              if (wasRunningBeforeHideRef.current) {
                wasRunningBeforeHideRef.current = false;
                setIsRunning(true);
              }
            }
          };

          document.addEventListener("visibilitychange", handleVisibilityChange);
          return () =>
            document.removeEventListener(
              "visibilitychange",
              handleVisibilityChange
            );
        }, []);

        const scrollToReader = useCallback(() => {
          const el = readerSectionRef.current;
          if (!el) return;
          const prefersReduced =
            window.matchMedia &&
            window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          el.scrollIntoView({
            behavior: prefersReduced ? "auto" : "smooth",
            block: "start",
          });
        }, []);

        const handleSelectDay = useCallback(
          (dayNumber) => {
            const clamped = Math.max(
              1,
              Math.min(CONTENIDO_BLOG.dias.length, dayNumber)
            );
            setActiveDay(clamped);
            scrollToReader();
          },
          [scrollToReader]
        );

        useEffect(() => {
          const handleKeyDown = (event) => {
            if (
              event.altKey ||
              event.ctrlKey ||
              event.metaKey ||
              event.shiftKey
            ) {
              return;
            }
            const target = event.target;
            if (
              target &&
              (target.tagName === "INPUT" ||
                target.tagName === "TEXTAREA" ||
                target.tagName === "SELECT" ||
                target.isContentEditable)
            ) {
              return;
            }

            if (event.key === "ArrowLeft" && activeDay > 1) {
              event.preventDefault();
              handleSelectDay(activeDay - 1);
            } else if (
              event.key === "ArrowRight" &&
              activeDay < CONTENIDO_BLOG.dias.length
            ) {
              event.preventDefault();
              handleSelectDay(activeDay + 1);
            }
          };

          window.addEventListener("keydown", handleKeyDown);
          return () => window.removeEventListener("keydown", handleKeyDown);
        }, [activeDay, handleSelectDay]);

        const handleStartReading = useCallback(() => {
          setHasStarted(true);
          setIsRunning(true);
          setActiveDay(1);
          scrollToReader();
        }, [scrollToReader]);

        const handleToggleRun = useCallback(() => {
          if (!hasStarted) {
            setHasStarted(true);
          }
          wasRunningBeforeHideRef.current = false;
          setIsRunning((prev) => !prev);
        }, [hasStarted]);

        const handleResetTimer = useCallback(() => {
          wasRunningBeforeHideRef.current = false;
          setIsRunning(false);
          setElapsedSeconds(0);
          setNoticeDismissed(false);
        }, []);

        const handleMarkVisited = useCallback((dayNumber) => {
          setVisitedDays((prev) => {
            if (prev.has(dayNumber)) return prev;
            const next = new Set(prev);
            next.add(dayNumber);
            return next;
          });
        }, []);

        const currentDia =
          CONTENIDO_BLOG.dias.find((d) => d.numero === activeDay) ||
          CONTENIDO_BLOG.dias[0];

        return (
          <div className="min-h-screen bg-[var(--bg-canvas)] text-[var(--text-primary)]">
            <a
              href="#lectura"
              className="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 focus:rounded focus:bg-[var(--accent-olive)] focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-[#FBF9F4]"
            >
              Saltar al contenido de lectura
            </a>

            <div className="sticky top-0 z-40">
              <ReadingClockBar
                elapsedSeconds={elapsedSeconds}
                isRunning={isRunning}
                hasStarted={hasStarted}
                totalEstimatedSeconds={totalEstimatedSeconds}
                isDark={isDark}
                noticeDismissed={noticeDismissed}
                onToggleRun={handleToggleRun}
                onReset={handleResetTimer}
                onToggleTheme={() => setIsDark((prev) => !prev)}
                onDismissNotice={() => setNoticeDismissed(true)}
              />
              <MobileTimelineStrip
                dias={CONTENIDO_BLOG.dias}
                activeDay={activeDay}
                visitedDays={visitedDays}
                onSelectDay={handleSelectDay}
              />
            </div>

            <main>
              <CoverSection
                proyecto={CONTENIDO_BLOG.proyecto}
                onStartReading={handleStartReading}
              />

              <section
                id="lectura"
                ref={readerSectionRef}
                aria-label="Lectura por días"
                className="scroll-mt-24 py-10 sm:py-12 lg:py-14"
              >
                <div className="mx-auto flex max-w-6xl flex-col gap-10 px-4 sm:px-6 lg:flex-row lg:gap-12">
                  <DesktopTimelineSidebar
                    dias={CONTENIDO_BLOG.dias}
                    activeDay={activeDay}
                    visitedDays={visitedDays}
                    onSelectDay={handleSelectDay}
                  />

                  <DayReader
                    dia={currentDia}
                    totalDias={CONTENIDO_BLOG.dias.length}
                    tesis={CONTENIDO_BLOG.proyecto.tesis}
                    isVisited={visitedDays.has(currentDia.numero)}
                    onMarkVisited={handleMarkVisited}
                    onPrev={() => handleSelectDay(activeDay - 1)}
                    onNext={() => handleSelectDay(activeDay + 1)}
                  />
                </div>
              </section>

              <ReferencesSection
                referencias={CONTENIDO_BLOG.referencias}
                creditosImagenes={CONTENIDO_BLOG.creditosImagenes}
                proyecto={CONTENIDO_BLOG.proyecto}
              />
            </main>
          </div>
        );
      }

      const rootElement = document.getElementById("root");
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    </script>
  </body>
</html>
