              'Todo proceso de investigación riguroso nace de una pregunta que inquieta y desafía lo evidente. En este recorrido grupal, nuestra mirada se ha centrado en una región profundamente marcada por los daños del conflicto armado en Colombia: los Montes de María. Nuestra pregunta de indagación busca responder: "¿Cuál fue la influencia de los grupos armados al margen de la ley en la concentración de la tenencia de la tierra en la región de los Montes de María entre 1990 y 2005?"',
              'Partimos de la convicción de que los problemas agrarios de nuestro país no se reducen a meras cifras económicas o atributos físicos del suelo. Por ello, nuestra tesis central postula: "En la región de los Montes de María entre 1990 y 2005, la presencia y accionar de los grupos armados al margen de la ley impulsó la concentración de la tenencia de la tierra al sustituir el control estatal y subordinar los derechos legales de propiedad campesina a través del despojo sistemático a favor de élites locales y terceros."',

              "Al poner estos datos en diálogo con los informes del Centro Nacional de Memoria Histórica, encontramos elementos que permiten comprender la relación entre violencia y transformación de la tenencia de la tierra. En el informe Un poco de verdad para poder respirar (2022), el CNMH registra que los casos de despojo o abandono forzado de tierras en los Montes de María aumentaron considerablemente durante el periodo de mayor intensidad del conflicto: se registraron 687 casos en 1999 y 798 en el año 2000. Estas cifras coinciden temporalmente con las principales masacres y desplazamientos masivos de la región.",

              "Para comprender lo ocurrido entre 1990 y 2005 en los montes de María hay que saber que ocurrió antes. La tenencia de tierras llevaba tiempo con problemas entre grandes hacendados que se dedicaban a la ganadería extensiva y explotación de madera, y campesinos con parcelas pequeñas. En los setentas, la Asociación Nacional de Usuarios Campesinos (ANUC), lideró la recuperación de fincas improductivas que distribuyeron entre pequeños agricultores. Aunque, la contrarreforma del Pacto de Chicoral (1973) generó una estigmatización hacia el movimiento campesino de alterar el orden, tambien que los terratenientes financiaran grupos de seguridad privada para evitar la invasión campesina.",
              "A esto se sumó la llegada de grupos guerrilleros como el ELN, EPL, PRT, CRS, luego en los noventa, los frentes 35 y 37 de las FARC, que realizaron secuestros, extorsiones y controles sobre la población. En los noventa, Grupos armados ligados a clanes familiares como los Méndez en Córdoba o los Meza en Ovejas, y a narcotraficantes como Luis Enrique Ramírez, alias Miki Ramírez, funcionaron como ejércitos privados. Luego usaron las cooperativas de seguridad Convivir, para volverse legales y tener un enlace con sectores de la fuerza pública.",

      /* =====================================================================
         LÓGICA DE TIEMPO DE LECTURA (200 palabras por minuto, límite 08:00)
         ===================================================================== */

      const { useState, useEffect, useMemo, useRef, useCallback } = React;

      const PALABRAS_POR_MINUTO = 200;
      const LIMITE_LECTURA_SEGUNDOS = 8 * 60; // 480 s (08:00)
      const UMBRAL_AMBAR_SEGUNDOS = 7 * 60; // 420 s (07:00)
      const THEME_STORAGE_KEY = "montes-maria-tema";

      function contarPalabrasTexto(texto) {
        if (!texto) return 0;
        const trimmed = String(texto).trim();
        if (!trimmed) return 0;
        return trimmed.split(/\s+/).filter(Boolean).length;
      }

      function diaTieneTexto(dia) {
        const tieneParrafos =
          Array.isArray(dia.parrafos) &&
          dia.parrafos.some((p) => p && p.trim().length > 0);
        const tieneAnalisis = Boolean(
          (dia.contexto && dia.contexto.trim()) ||
            (dia.perspectiva && dia.perspectiva.trim()) ||
            (dia.aporteALaTesis && dia.aporteALaTesis.trim()) ||
            (dia.dilemaEtico && dia.dilemaEtico.trim()) ||
            (dia.cita && dia.cita.trim()) ||
            (dia.nuestraPostura && dia.nuestraPostura.trim())
        );
        return tieneParrafos || tieneAnalisis;
      }

      function contarPalabrasDia(dia) {
        if (!diaTieneTexto(dia)) return 0;
        let total = 0;
        if (Array.isArray(dia.parrafos)) {
          for (const p of dia.parrafos) {
            total += contarPalabrasTexto(p);
          }
        }
        total += contarPalabrasTexto(dia.contexto);
        total += contarPalabrasTexto(dia.perspectiva);
        total += contarPalabrasTexto(dia.aporteALaTesis);
        total += contarPalabrasTexto(dia.dilemaEtico);
        total += contarPalabrasTexto(dia.cita);
        total += contarPalabrasTexto(dia.nuestraPostura);
        return total;
      }

      function calcularSegundosLecturaDia(dia) {
        const palabras = contarPalabrasDia(dia);
        if (palabras === 0) return 0;
        return Math.max(1, Math.round((palabras / PALABRAS_POR_MINUTO) * 60));
      }

      function calcularSegundosTotales(dias) {
        return dias.reduce(
          (acc, dia) => acc + calcularSegundosLecturaDia(dia),
          0
        );
      }

      function formatearRelojMMSS(segundos) {
        const safe = Math.max(0, Math.floor(segundos));
        const mins = Math.floor(safe / 60);
        const secs = safe % 60;
        return (
          String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0")
        );
      }

      function formatearMinYS(segundos) {
        const safe = Math.max(0, Math.round(segundos));
        const mins = Math.floor(safe / 60);
        const secs = safe % 60;
        return mins + " min " + secs + " s";
      }

        return bloques.map((bloque, idx) => (
          <p

          >

      function DayReader({
        dia,
        totalDias,
        tesis,
        isVisited,
        onMarkVisited,
        onPrev,
        onNext,
      }) {
        const sentinelRef = useRef(null);
        const [imageError, setImageError] = useState(false);

        const hasText = diaTieneTexto(dia);
        const readingSeconds = calcularSegundosLecturaDia(dia);
        const showTesis = dia.numero === 1 || dia.numero === 7;
        const isSourceDay = dia.numero >= 2 && dia.numero <= 6;
        const tituloMostrado =
          (dia.titulo && dia.titulo.trim()) || "Día " + dia.numero;

        useEffect(() => {
          setImageError(false);
        }, [dia.numero, dia.imagen && dia.imagen.src]);

        useEffect(() => {
          const el = sentinelRef.current;
          if (!el || isVisited) return;

          if (typeof IntersectionObserver === "undefined") {
            onMarkVisited(dia.numero);
            return;
          }

          const observer = new IntersectionObserver(
            (entries) => {
              for (const entry of entries) {
                if (entry.isIntersecting) {
                  onMarkVisited(dia.numero);
                  observer.disconnect();
                  break;
                }
              }
            },
            { threshold: 0.5 }
          );

          observer.observe(el);
          return () => observer.disconnect();
        }, [dia.numero, isVisited, onMarkVisited]);

        const metaFuente = dia.fuente
          ? [dia.fuente.autor, dia.fuente.tipo, dia.fuente.anio]
              .map((s) => (s ? String(s).trim() : ""))
              .filter(Boolean)
          : [];

        return (
          <article
            aria-labelledby={"dia-titulo-" + dia.numero}
            className="min-w-0 flex-1 max-w-[68ch]"

                {dia.integrante && dia.integrante.trim() && (
                  <>
                    <span aria-hidden="true">·</span>
                    <span>Por {dia.integrante}</span>
                  </>

                  <>
                    <span aria-hidden="true">·</span>

                      <IconCheck className="h-3.5 w-3.5" />
                      <span>Visto</span>
                    </span>
                  </>
                )}

                className="font-serif-editorial text-balance mt-2 text-2xl font-semibold leading-tight text-[var(--text-primary)] sm:text-3xl"
              >
                {tituloMostrado}

              {dia.subtitulo && dia.subtitulo.trim() && (
                <p className="mt-2 text-base text-[var(--text-secondary)]">
                  {dia.subtitulo}

                <p className="mt-3 text-xs font-medium text-[var(--text-muted)]">
                  Lectura estimada:{" "}
                  <span className="font-mono-clock text-[var(--text-secondary)]">
                    {formatearMinYS(readingSeconds)}

            {showTesis && (

            {!hasText ? (

                {isVisited
                  ? "Día " + dia.numero + " marcado como visto"
                  : "Fin del Día " + dia.numero}
              </span>
              {isVisited && (
                <span className="inline-flex items-center gap-1 font-medium text-[var(--accent-olive)]">
                  <IconCheck className="h-3.5 w-3.5" />
                  <span>Lectura registrada</span>
                </span>
              )}
            </div>

            <nav
              aria-label="Navegación entre días"
              className="mt-6 flex flex-col gap-4 border-t border-[var(--border-hairline)] pt-6 sm:flex-row sm:items-center sm:justify-between"
            >
              <div className="flex items-center gap-3">
                <button
                  type="button"
                  onClick={onPrev}
                  disabled={dia.numero <= 1}
                  className="inline-flex min-h-[44px] items-center gap-2 rounded border border-[var(--border-hairline)] bg-[var(--bg-elevated)] px-4 py-2 text-sm font-medium text-[var(--text-primary)] transition-colors hover:border-[var(--border-strong)] hover:bg-[var(--bg-surface)] disabled:cursor-not-allowed disabled:opacity-40 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--accent-olive)] cursor-pointer whitespace-nowrap"
                >
                  <IconArrowLeft className="h-4 w-4" />
                  <span>Anterior</span>
                </button>

                <button
                  type="button"
                  onClick={onNext}
                  disabled={dia.numero >= totalDias}
                  className="inline-flex min-h-[44px] items-center gap-2 rounded bg-[var(--accent-olive)] px-4 py-2 text-sm font-medium text-[#FBF9F4] transition-colors hover:bg-[var(--accent-olive-hover)] disabled:cursor-not-allowed disabled:opacity-40 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--accent-olive)] cursor-pointer whitespace-nowrap"
                >
                  <span>Siguiente</span>
                  <IconArrowRight className="h-4 w-4" />
                </button>
              </div>

              <p className="text-xs text-[var(--text-muted)]">
                Atajo de teclado: flechas ← y →
              </p>
            </nav>
          </article>
        );
      }

      function ReferencesSection({ referencias, creditosImagenes, proyecto }) {
        const creditosValidos = (creditosImagenes || []).filter(
          (c) =>
            (c.descripcion && c.descripcion.trim()) ||
            (c.credito && c.credito.trim())
        );

        return (
          <section
            id="referencias"
            aria-labelledby="titulo-referencias"
            className="border-t border-[var(--border-hairline)] bg-[var(--bg-surface)]/55"
          >
            <div className="mx-auto max-w-6xl px-4 py-12 sm:px-6 sm:py-14">
              <div className="max-w-4xl">
                <p className="text-xs font-semibold tracking-wider text-[var(--accent-ochre)] uppercase">
                  Archivo bibliográfico
                </p>
                <h2
                  id="titulo-referencias"
                  className="font-serif-editorial mt-2 text-2xl font-semibold text-[var(--text-primary)] sm:text-3xl"
                >
                  Referencias y créditos
                </h2>
                <p className="mt-2 text-sm text-[var(--text-secondary)]">
                  Fuentes primarias, informes de memoria histórica, prensa y
                  cartografía consultadas para este ejercicio académico. Los
                  enlaces se abren en una pestaña nueva.
                </p>

                <ol className="mt-7 divide-y divide-[var(--border-hairline)] border-y border-[var(--border-hairline)]">
                  {referencias.map((ref, idx) => (
                    <li
                      key={idx}
                      className="flex flex-col gap-1.5 py-3.5 text-sm sm:flex-row sm:items-baseline sm:justify-between sm:gap-6"
                    >
                      <span className="leading-relaxed text-[var(--text-primary)]">
                        <span className="font-mono-clock mr-2 text-xs text-[var(--text-muted)]">
                          {String(idx + 1).padStart(2, "0")}.
                        </span>
                        {ref.cita}
                      </span>

                      {ref.enlace && ref.enlace.trim() && (
                        <a
                          href={ref.enlace}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="inline-flex shrink-0 items-center gap-1 text-xs font-semibold text-[var(--accent-olive)] underline decoration-[var(--border-strong)] underline-offset-4 transition-colors hover:text-[var(--accent-olive-hover)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--accent-olive)] whitespace-nowrap"
                        >
                          <span>Consultar enlace</span>
                          <IconExternalLink className="h-3.5 w-3.5" />
                        </a>
                      )}
                    </li>
                  ))}
                </ol>

                {creditosValidos.length > 0 && (
                  <div className="mt-9">
                    <h3 className="text-xs font-semibold tracking-wider text-[var(--text-muted)] uppercase">
                      Créditos de imágenes
                    </h3>
                    <ul className="mt-3 divide-y divide-[var(--border-hairline)] border-y border-[var(--border-hairline)] text-sm">
                      {creditosValidos.map((item, idx) => (
                        <li
                          key={idx}
                          className="flex flex-col gap-1 py-3 sm:flex-row sm:items-baseline sm:justify-between sm:gap-4"
                        >
                          <span className="text-[var(--text-primary)]">
                            {item.descripcion}{" "}
                            {item.credito && (
                              <span className="text-[var(--text-secondary)]">
                                — {item.credito}
                              </span>
                            )}
                          </span>
                          {item.enlace && item.enlace.trim() && (
                            <a
                              href={item.enlace}
                              target="_blank"
                              rel="noopener noreferrer"
                              className="inline-flex shrink-0 items-center gap-1 text-xs font-semibold text-[var(--accent-olive)] underline underline-offset-4 whitespace-nowrap"
                            >
                              <span>Fuente</span>
                              <IconExternalLink className="h-3.5 w-3.5" />
                            </a>
                          )}
                        </li>
                      ))}
                    </ul>
                  </div>
                )}

                <footer className="mt-10 border-t border-[var(--border-hairline)] pt-6 text-xs text-[var(--text-muted)]">
                  <p className="font-medium text-[var(--text-secondary)]">
                    {proyecto.grupo} · {proyecto.curso}
                  </p>
                  <p className="mt-1">
                    {proyecto.integrantes.map((i) => i.nombre).join(" · ")}
                  </p>
                </footer>
              </div>
            </div>
          </section>
        );
      }

      /* =====================================================================
         APLICACIÓN PRINCIPAL
         ===================================================================== */

      function App() {
        const [activeDay, setActiveDay] = useState(1);
        const [visitedDays, setVisitedDays] = useState(() => new Set());
        const [elapsedSeconds, setElapsedSeconds] = useState(0);
        const [isRunning, setIsRunning] = useState(false);
        const [hasStarted, setHasStarted] = useState(false);
        const [noticeDismissed, setNoticeDismissed] = useState(false);
        const [isDark, setIsDark] = useState(() => {
          try {
            return localStorage.getItem(THEME_STORAGE_KEY) === "dark";
          } catch {
            return false;
          }
        });

        const readerSectionRef = useRef(null);
        const wasRunningBeforeHideRef = useRef(false);

        const totalEstimatedSeconds = useMemo(
          () => calcularSegundosTotales(CONTENIDO_BLOG.dias),
          []
        );

        useEffect(() => {
          const root = document.documentElement;
          if (isDark) {
            root.classList.add("dark");
          } else {
            root.classList.remove("dark");
          }
          try {
            localStorage.setItem(THEME_STORAGE_KEY, isDark ? "dark" : "light");
          } catch {
            // Ignorar en entornos sin localStorage
          }
        }, [isDark]);

        useEffect(() => {
          if (!isRunning) return;
          const interval = window.setInterval(() => {
            setElapsedSeconds((prev) => prev + 1);
          }, 1000);
          return () => window.clearInterval(interval);
        }, [isRunning]);

        useEffect(() => {
          const handleVisibilityChange = () => {
            if (document.visibilityState === "hidden") {
              setIsRunning((currentlyRunning) => {
                wasRunningBeforeHideRef.current = currentlyRunning;
                return false;
              });
            } else if (document.visibilityState === "visible") {
              if (wasRunningBeforeHideRef.current) {
                wasRunningBeforeHideRef.current = false;
                setIsRunning(true);
              }
            }
          };

          document.addEventListener("visibilitychange", handleVisibilityChange);
          return () =>
            document.removeEventListener(
              "visibilitychange",
              handleVisibilityChange
            );
        }, []);

        const scrollToReader = useCallback(() => {
          const el = readerSectionRef.current;
          if (!el) return;
          const prefersReduced =
            window.matchMedia &&
            window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          el.scrollIntoView({
            behavior: prefersReduced ? "auto" : "smooth",
            block: "start",
          });
        }, []);

        const handleSelectDay = useCallback(
          (dayNumber) => {
            const clamped = Math.max(
              1,
              Math.min(CONTENIDO_BLOG.dias.length, dayNumber)
            );
            setActiveDay(clamped);
            scrollToReader();
          },
          [scrollToReader]
        );

        useEffect(() => {
          const handleKeyDown = (event) => {
            if (
              event.altKey ||
              event.ctrlKey ||
              event.metaKey ||
              event.shiftKey
            ) {
              return;
            }
            const target = event.target;
            if (
              target &&
              (target.tagName === "INPUT" ||
                target.tagName === "TEXTAREA" ||
                target.tagName === "SELECT" ||
                target.isContentEditable)
            ) {
              return;
            }

            if (event.key === "ArrowLeft" && activeDay > 1) {
              event.preventDefault();
              handleSelectDay(activeDay - 1);
            } else if (
              event.key === "ArrowRight" &&
              activeDay < CONTENIDO_BLOG.dias.length
            ) {
              event.preventDefault();
              handleSelectDay(activeDay + 1);
            }
          };

          window.addEventListener("keydown", handleKeyDown);
          return () => window.removeEventListener("keydown", handleKeyDown);
        }, [activeDay, handleSelectDay]);

        const handleStartReading = useCallback(() => {
          setHasStarted(true);
          setIsRunning(true);
          setActiveDay(1);
          scrollToReader();
        }, [scrollToReader]);

        const handleToggleRun = useCallback(() => {
          if (!hasStarted) {
            setHasStarted(true);
          }
          wasRunningBeforeHideRef.current = false;
          setIsRunning((prev) => !prev);
        }, [hasStarted]);

        const handleResetTimer = useCallback(() => {
          wasRunningBeforeHideRef.current = false;
          setIsRunning(false);
          setElapsedSeconds(0);
          setNoticeDismissed(false);
        }, []);

        const handleMarkVisited = useCallback((dayNumber) => {
          setVisitedDays((prev) => {
            if (prev.has(dayNumber)) return prev;
            const next = new Set(prev);
            next.add(dayNumber);
            return next;
          });
        }, []);

        const currentDia =
          CONTENIDO_BLOG.dias.find((d) => d.numero === activeDay) ||
          CONTENIDO_BLOG.dias[0];

        return (
          <div className="min-h-screen bg-[var(--bg-canvas)] text-[var(--text-primary)]">
            <a
              href="#lectura"
              className="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 focus:rounded focus:bg-[var(--accent-olive)] focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-[#FBF9F4]"
            >
              Saltar al contenido de lectura
            </a>

            <div className="sticky top-0 z-40">
              <ReadingClockBar
                elapsedSeconds={elapsedSeconds}
                isRunning={isRunning}
                hasStarted={hasStarted}
                totalEstimatedSeconds={totalEstimatedSeconds}
                isDark={isDark}
                noticeDismissed={noticeDismissed}
                onToggleRun={handleToggleRun}
                onReset={handleResetTimer}
                onToggleTheme={() => setIsDark((prev) => !prev)}
                onDismissNotice={() => setNoticeDismissed(true)}
              />
              <MobileTimelineStrip
                dias={CONTENIDO_BLOG.dias}
                activeDay={activeDay}
                visitedDays={visitedDays}
                onSelectDay={handleSelectDay}
              />
            </div>

            <main>
              <CoverSection
                proyecto={CONTENIDO_BLOG.proyecto}
                onStartReading={handleStartReading}
              />

              <section
                id="lectura"
                ref={readerSectionRef}
                aria-label="Lectura por días"
                className="scroll-mt-24 py-10 sm:py-12 lg:py-14"
              >
                <div className="mx-auto flex max-w-6xl flex-col gap-10 px-4 sm:px-6 lg:flex-row lg:gap-12">
                  <DesktopTimelineSidebar
                    dias={CONTENIDO_BLOG.dias}
                    activeDay={activeDay}
                    visitedDays={visitedDays}
                    onSelectDay={handleSelectDay}
                  />

                  <DayReader
                    dia={currentDia}
                    totalDias={CONTENIDO_BLOG.dias.length}
                    tesis={CONTENIDO_BLOG.proyecto.tesis}
                    isVisited={visitedDays.has(currentDia.numero)}
                    onMarkVisited={handleMarkVisited}
                    onPrev={() => handleSelectDay(activeDay - 1)}
                    onNext={() => handleSelectDay(activeDay + 1)}
                  />
                </div>
              </section>

              <ReferencesSection
                referencias={CONTENIDO_BLOG.referencias}
                creditosImagenes={CONTENIDO_BLOG.creditosImagenes}
                proyecto={CONTENIDO_BLOG.proyecto}
              />
            </main>
          </div>
        );
      }

      const rootElement = document.getElementById("root");
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    </script>
  </body>
</html>
